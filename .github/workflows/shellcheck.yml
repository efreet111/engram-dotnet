name: Shellcheck

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run ShellCheck
        uses: ludwanpierre/shellcheck-github-action@v1
        with:
          scflags: "-x -S error"
          include: "scripts/*.sh *.sh"
