[supervisord]
nodaemon=true
user=root

; PostgreSQL arranca primero (priority más baja = primero).
; El script allinone-postgres.sh hace initdb/createdb si es necesario y
; luego corre postgres en foreground.
[program:postgres]
command=/usr/local/bin/allinone-postgres.sh
priority=100
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Servidor engram. `engram serve` es el entrypoint real (Engram.Server.dll
; es una librería — OutputType=Library — sin punto de entrada; el ejecutable
; es el CLI `engram`, ver src/Engram.Cli/Engram.Cli.csproj AssemblyName=engram).
[program:engram]
command=/app/engram serve
directory=/app
priority=200
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
