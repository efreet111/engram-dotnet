version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Engram — SQLite-only Docker Compose
# SQLite data must be persisted by mounting the host volume at /data/engram.
# ─────────────────────────────────────────────────────────────────────────────

services:
  engram:
    image: engram-dotnet:latest
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        ENGRAM_VERSION: v1.3.0
    container_name: engram
    restart: unless-stopped

    ports:
      - "7437:7437"

    volumes:
      - ${ENGRAM_DATA_DIR_HOST:-./data}:/data/engram

    environment:
      ENGRAM_DB_TYPE: sqlite
      ENGRAM_DATA_DIR: /data/engram
      ENGRAM_PORT: "7437"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7437/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
